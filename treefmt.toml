excludes = ["CHANGELOG.md", "doc/design.pen", "detekt-baseline.xml"]
walk = "git"

[formatter.biome]
command = "biome"
includes = ["*.json"]
options = ["format", "--write"]

[formatter.formatjson5]
command = "formatjson5"
includes = ["*.json5"]
options = ["--replace", "--indent", "2"]

[formatter.ktfmt]
command = "ktfmt"
includes = ["*.kt", "*.kts"]

[formatter.rumdl]
command = "rumdl"
includes = ["*.md"]
options = ["fmt"]

[formatter.tombi]
command = "tombi"
includes = ["*.toml"]
options = ["format"]

[formatter.toml-sort]
command = "toml-sort"
includes = ["*.toml"]
options = ["--in-place", "--sort-table-keys", "--sort-inline-tables"]

[formatter.typos]
command = "typos"
includes = ["*"]
options = ["--write-changes", "--force-exclude"]

[formatter.yamlfmt]
command = "yamlfmt"
includes = ["*.yaml", "*.yml"]
