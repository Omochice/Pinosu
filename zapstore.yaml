repository: https://github.com/Omochice/Pinosu
summary: A decentralized feed reader and web bookmark app for Android, powered by Nostr
description: |
  Pinosu is a decentralized feed reader and web bookmark app for Android, powered by Nostr.
  Read your RSS and Atom feeds, and bookmark the articles worth keeping.
  You keep full ownership of your data, with no central server.

  Features:

  - Read RSS and Atom feeds, grouped into categories
  - Read articles in the app, with their images and tables
  - Feed subscriptions stored as NIP-78 (Kind 30078) app data, shared across devices
  - Save and organize web bookmarks
  - Bookmarks stored as Nostr Kind 39701 (web bookmark) events
  - Access from any Nostr-compatible client
  - Sync across devices through Nostr relays

  Requirements:

  - A NIP-55 compatible signer app (e.g. Amber)
